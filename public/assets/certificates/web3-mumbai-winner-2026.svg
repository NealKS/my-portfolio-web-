<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="60%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="850" fill="url(#bgGrad2)"/>

  <!-- Ornate Border with Golden Trim -->
  <rect x="40" y="40" width="1120" height="770" rx="16" fill="none" stroke="url(#gold2)" stroke-width="3"/>
  <rect x="52" y="52" width="1096" height="746" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Corner Badges -->
  <circle cx="52" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="1148" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="52" cy="798" r="6" fill="#F59E0B"/>
  <circle cx="1148" cy="798" r="6" fill="#F59E0B"/>

  <!-- Header Section -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Trophy Icon in Badge -->
    <circle cx="0" cy="-35" r="32" fill="#1E293B" stroke="url(#gold2)" stroke-width="2.5"/>
    <path d="M-12,-48 L12,-48 L9,-25 C8,-20 3,-16 0,-16 C-3,-16 -8,-20 -9,-25 Z" fill="url(#gold2)"/>
    <path d="M-15,-45 L-12,-45 L-10,-35 C-10,-30 -14,-30 -15,-35 Z" fill="none" stroke="url(#gold2)" stroke-width="2"/>
    <path d="M15,-45 L12,-45 L10,-35 C10,-30 14,-30 15,-35 Z" fill="none" stroke="url(#gold2)" stroke-width="2"/>
    <path d="M-4,-16 L4,-16 L6,-8 L-6,-8 Z" fill="url(#gold2)"/>
    <rect x="-10" y="-8" width="20" height="4" fill="url(#gold2)" rx="1"/>

    <text y="15" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#14B8A6">
      WEB3 BUILDERS COLLECTIVE • MUMBAI TECH SUMMIT
    </text>
    <text y="50" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="1" fill="#FFFFFF">
      HACKATHON GRAND PRIZE WINNER
    </text>
  </g>

  <text x="600" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-style="italic" fill="#94A3B8">
    This prestigious award is presented to
  </text>

  <!-- Winner Name -->
  <g transform="translate(600, 315)" text-anchor="middle">
    <rect x="-260" y="-45" width="520" height="70" fill="url(#amberGlow)" rx="10"/>
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#gold2)" letter-spacing="1">
      Neal Kottilingal
    </text>
  </g>

  <!-- Track / Project Details -->
  <g transform="translate(600, 400)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">
      FOR SECURING 1ST PLACE • TRACK: PROTOCOLS & DISTRIBUTED STATE CHANNELS
    </text>
    <text y="30" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">
      Recognized for outstanding architecture in high-frequency smart contract state verification,
    </text>
    <text y="55" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">
      sub-second algorithmic indexing, and frictionless Web3 user experience design.
    </text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(600, 545)">
    <circle cx="0" cy="0" r="50" fill="#1A2230" stroke="url(#gold2)" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="2">
      1ST PLACE
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">
      CHAMPION
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#14B8A6">
      MUMBAI 2026
    </text>
  </g>

  <!-- Signatures -->
  <g transform="translate(200, 700)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="-12" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-size="22" fill="#E2E8F0">
      Hackathon Jury Board
    </text>
    <text x="110" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
      LEAD TECHNICAL EVALUATOR
    </text>
  </g>

  <g transform="translate(780, 700)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="-12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F59E0B">
      February 2026
    </text>
    <text x="110" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
      DATE OF ACHEIVEMENT
    </text>
  </g>

  <!-- Footer Verification -->
  <text x="600" y="785" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569" letter-spacing="1">
    CERTIFICATE REF: <tspan fill="#F59E0B">W3-MUM-2026-WIN-01</tspan> • MUMBAI, MAHARASHTRA, INDIA
  </text>
</svg>
