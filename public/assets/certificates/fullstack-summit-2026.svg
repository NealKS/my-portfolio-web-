  </defs>

  <rect width="1200" height="850" fill="url(#bg3)"/>

  <!-- Border -->
  <rect x="40" y="40" width="1120" height="770" rx="16" fill="none" stroke="url(#teal3)" stroke-width="2.5"/>
  <rect x="52" y="52" width="1096" height="746" rx="12" fill="none" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Header Section -->
  <g transform="translate(600, 130)" text-anchor="middle">
