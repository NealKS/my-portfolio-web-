  <rect x="52" y="52" width="1096" height="746" rx="12" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Header Section -->
  <g transform="translate(600, 130)" text-anchor="middle">
